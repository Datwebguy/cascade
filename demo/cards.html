<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0c1a;color:#ecebfa;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  .stage{position:relative;height:100%;display:grid;place-items:center;text-align:center}
  .glow{position:absolute;width:70vw;height:70vw;border-radius:50%;background:radial-gradient(circle,rgba(123,108,255,.35),transparent 60%);filter:blur(20px);top:-20vw;right:-15vw}
  .glow2{position:absolute;width:55vw;height:55vw;border-radius:50%;background:radial-gradient(circle,rgba(62,230,216,.18),transparent 60%);bottom:-25vw;left:-10vw}
  h1{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.02}
  .grad{background:linear-gradient(135deg,#8b7cff,#5b8cff 45%,#3ee6d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .fade{opacity:0;transform:translateY(18px);animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .word{font-family:"Bricolage Grotesque";font-weight:700;font-size:72px;letter-spacing:-.03em}
  .sub{color:#a3a6c8;font-size:30px;margin-top:22px}
  .mark path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1.1s .35s ease forwards}
  .mark .dot{opacity:0;animation:pop .4s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}} @keyframes pop{to{opacity:1}}
  .nets{display:flex;gap:22px;justify-content:center;margin-top:46px}
  .net{width:250px;padding:22px;border-radius:20px;background:#14162b;border:1px solid #272a48;text-align:left;font-size:20px;color:#a3a6c8}
  .net b{display:block;color:#ecebfa;font-size:22px;margin-bottom:10px}
  .tiny{font-size:22px;color:#a3a6c8;margin-top:40px}
</style></head>
<body><div class="stage"><div class="glow"></div><div class="glow2"></div><div id="c"></div></div>
<script>
const LOGO = `<svg class="mark" width="150" height="150" viewBox="0 0 64 64"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1E3C"/><stop offset="1" stop-color="#0B0D1E"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#3EE6D8"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#b)"/><g fill="none" stroke="url(#s)" stroke-width="4.5" stroke-linecap="round"><path d="M32 18 C32 30 17 29 17 43"/><path d="M32 18 V43"/><path d="M32 18 C32 30 47 29 47 43"/></g><circle class="dot" style="animation-delay:.1s" cx="32" cy="14" r="5.5" fill="#8B7CFF"/><circle class="dot" style="animation-delay:1.2s" cx="17" cy="49" r="4.5" fill="#3EE6D8"/><circle class="dot" style="animation-delay:1.3s" cx="32" cy="49" r="4.5" fill="#3EE6D8"/><circle class="dot" style="animation-delay:1.4s" cx="47" cy="49" r="4.5" fill="#3EE6D8"/></svg>`;
const card = new URLSearchParams(location.search).get("card");
const c = document.getElementById("c");
if (card === "intro" || card === "outro") {
  c.innerHTML = `<div>${LOGO}<div class="word fade" style="animation-delay:.6s;margin-top:18px">cascade</div>
  <h1 class="fade" style="font-size:64px;margin-top:26px;animation-delay:1.1s">One idea. <span class="grad">Every channel.</span></h1>
  <div class="sub fade" style="animation-delay:1.6s">${card === "outro" ? "oncascade.vercel.app" : "Built on the Buffer API"}</div>
  ${card === "outro" ? '<div class="tiny fade" style="animation-delay:2.1s">Built for Buffer Commit 2026 · Not affiliated with Buffer</div>' : ""}</div>`;
} else if (card === "problem") {
  const nets = [["X","Rewrite it short…"],["LinkedIn","Rewrite it longer…"],["Instagram","Rewrite it as a caption…"],["Threads","Rewrite it again…"]];
  c.innerHTML = `<div><h1 class="fade" style="font-size:66px">One idea, <span class="grad">rewritten again and again</span></h1>
  <div class="nets">${nets.map((n,i)=>`<div class="net fade" style="animation-delay:${1.2+i*0.6}s"><b>${n[0]}</b>${n[1]}</div>`).join("")}</div>
  <div class="sub fade" style="animation-delay:4.4s">…then pasted into Buffer, one channel at a time.</div></div>`;
}
</script></body></html>
