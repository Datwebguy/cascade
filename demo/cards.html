<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#f6f5fb;color:#12132a;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  .stage{position:relative;height:100%;display:grid;place-items:center;text-align:center}
  .wash{position:absolute;inset:0;background:radial-gradient(60% 50% at 85% 0%,rgba(139,124,255,.18),transparent 70%),radial-gradient(50% 45% at 0% 100%,rgba(62,230,216,.16),transparent 70%)}
  h1{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.02}
  .grad{background:linear-gradient(135deg,#7b6cff,#5b8cff 45%,#22c3b5);-webkit-background-clip:text;background-clip:text;color:transparent}
  .in{opacity:0;transform:translateY(16px);animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .word{font-family:"Bricolage Grotesque";font-weight:700;font-size:64px;letter-spacing:-.035em}
  .sub{color:#5e6280;font-size:30px;margin-top:20px}
  .mark path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1s .3s ease forwards}
  .mark .dot{opacity:0;animation:pop .35s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}} @keyframes pop{to{opacity:1}}
  /* hook: one idea card, streams fanning into four tiles */
  .idea{display:inline-block;background:#fff;border:1px solid #e4e3f0;border-radius:22px;padding:22px 30px;box-shadow:0 24px 50px -24px rgba(40,30,120,.35);font-family:"Bricolage Grotesque";font-size:34px;font-weight:600}
  .idea small{display:block;font-family:Inter;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#5847f0;font-weight:700;margin-bottom:6px}
  .tiles{display:grid;grid-template-columns:repeat(4,250px);gap:22px;justify-content:center}
  .tile{background:#fff;border:1px solid #e4e3f0;border-radius:18px;padding:18px 20px;text-align:left;box-shadow:0 10px 24px -14px rgba(18,19,42,.25);height:118px}
  .tile b{display:flex;align-items:center;gap:8px;font-size:19px;margin-bottom:10px}
  .bar{height:10px;border-radius:6px;background:#eceaf6;margin-top:8px}
  .bar.w1{width:92%}.bar.w2{width:70%}.bar.w3{width:84%}
  .tile .busy{color:#a8670a;font-size:15px;font-weight:600}
  svg.streams{display:block;margin:0 auto}
  svg.streams path{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw2 1s ease forwards}
  @keyframes draw2{to{stroke-dashoffset:0}}
  .caption{font-size:30px;color:#5e6280;margin-top:34px}
</style></head>
<body><div class="stage"><div class="wash"></div><div id="c" style="position:relative"></div></div>
<script>
const LOGO = (size) => `<svg class="mark" width="${size}" height="${size}" viewBox="0 0 64 64"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1E3C"/><stop offset="1" stop-color="#0B0D1E"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#3EE6D8"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#b)"/><g fill="none" stroke="url(#s)" stroke-width="4.5" stroke-linecap="round"><path d="M32 18 C32 30 17 29 17 43"/><path d="M32 18 V43"/><path d="M32 18 C32 30 47 29 47 43"/></g><circle class="dot" style="animation-delay:.1s" cx="32" cy="14" r="5.5" fill="#8B7CFF"/><circle class="dot" style="animation-delay:1.1s" cx="17" cy="49" r="4.5" fill="#3EE6D8"/><circle class="dot" style="animation-delay:1.2s" cx="32" cy="49" r="4.5" fill="#3EE6D8"/><circle class="dot" style="animation-delay:1.3s" cx="47" cy="49" r="4.5" fill="#3EE6D8"/></svg>`;
const NETS = [["X", "Wants it short"], ["LinkedIn", "Wants the story"], ["Instagram", "Wants a caption"], ["Threads", "Wants it casual"]];
const card = new URLSearchParams(location.search).get("card");
const c = document.getElementById("c");
if (card === "hook") {
  const xs = [125, 397, 669, 941];
  c.innerHTML = `<div>
    <h1 class="in" style="font-size:60px;margin-bottom:44px">One idea. <span class="grad">Every network wants it different.</span></h1>
    <div class="idea in" style="animation-delay:.6s"><small>Today's idea</small>Consistency beats polish.</div>
    <svg class="streams" width="1066" height="90" viewBox="0 0 1066 90">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B7CFF"/><stop offset="1" stop-color="#3EE6D8"/></linearGradient></defs>
      ${xs.map((x,i)=>`<path stroke="url(#g)" style="animation-delay:${1.2+i*0.15}s" d="M533 0 C533 45 ${x} 40 ${x} 90"/>`).join("")}
    </svg>
    <div class="tiles">${NETS.map((n,i)=>`<div class="tile in" style="animation-delay:${1.8+i*0.25}s"><b>${n[0]}</b><span class="busy">${n[1]}</span><div class="bar w1"></div><div class="bar w${(i%3)+1}"></div></div>`).join("")}</div>
    <div class="caption in" style="animation-delay:9.5s">…so you rewrite it by hand, every day.</div>
  </div>`;
} else if (card === "uses") {
  const uses = [
    ["Founder", "Announces a launch on every network in a minute.", "X · LinkedIn · Threads", 0.6],
    ["Small business", "Shares today's offer on every channel.", "Instagram · Facebook · Google", 4.0],
    ["Creator", "Promotes a new video without rewriting it five times.", "YouTube · X · Instagram", 7.4],
  ];
  c.innerHTML = `<div>
    <h1 class="in" style="font-size:58px;margin-bottom:46px">What you can do with <span class="grad">Cascade</span></h1>
    <div style="display:grid;grid-template-columns:repeat(3,400px);gap:26px;justify-content:center">
    ${uses.map(([who, what, nets, d]) => `<div class="tile in" style="height:auto;padding:28px;animation-delay:${d}s">
      <b style="font-family:'Bricolage Grotesque';font-size:30px">${who}</b>
      <div style="font-size:23px;line-height:1.4;color:#12132a;margin:6px 0 16px">${what}</div>
      <div style="font-size:16px;font-weight:600;color:#5847f0">${nets}</div></div>`).join("")}
    </div></div>`;
} else if (card === "answer" || card === "outro") {
  c.innerHTML = `<div>${LOGO(140)}<div class="word in" style="animation-delay:.5s;margin-top:14px">cascade</div>
    <h1 class="in" style="font-size:72px;margin-top:22px;animation-delay:1s">One idea. <span class="grad">Every channel.</span></h1>
    <div class="sub in" style="animation-delay:1.5s">${card === "outro" ? "oncascade.vercel.app" : "Built on the Buffer API"}</div>
    ${card === "outro" ? '<div class="in" style="animation-delay:2s;margin-top:34px;color:#5e6280;font-size:20px">Built on the Buffer API for Buffer Commit 2026 · Not affiliated with Buffer</div>' : ""}</div>`;
}
</script></body></html>
